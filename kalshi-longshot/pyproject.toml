[project]
name = "kalshi-longshot"
version = "0.1.0"
description = "Posts maker NO bids on overpriced long-shot Kalshi markets, with calibration and honest paper trading"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "cryptography>=41"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["longshot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
