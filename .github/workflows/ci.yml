name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  app:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  database:
    name: Migrations and RLS policies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the schema and RLS tests
        run: ./scripts/test-db.sh
